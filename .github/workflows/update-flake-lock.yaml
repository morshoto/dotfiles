name: Update Flake Lock

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Update flake inputs
        run: nix flake update --flake "$GITHUB_WORKSPACE"

      - name: Check flake
        run: nix flake check --all-systems --show-trace "path:$GITHUB_WORKSPACE"

      - name: Build Home Manager configuration
        run: nix run "path:$GITHUB_WORKSPACE#build" -- --show-trace

      - name: Create or update pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/update-flake-lock
          delete-branch: true
          add-paths: flake.lock
          commit-message: "chore: update flake.lock"
          title: "chore: update flake.lock"
          body: |
            Automated flake input update.

            Validation completed with `nix flake check --all-systems` and the
            Home Manager build before this pull request was created or updated.
